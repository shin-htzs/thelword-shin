const PROFILES={"Alice Pieszecki": {"actor": "Leisha Hailey", "keywords": ["敏锐", "好奇", "社交雷达", "幽默"], "analysis": "你很会读空气，也很会读人。你习惯把别人的情绪、关系和细节串成一张地图；表面上轻松、爱开玩笑，真正重要的时候却非常认真。你不一定是房间里最有掌控欲的人，但往往是最早发现“发生了什么”的那个人。你的成长课题，是别让观察别人变成逃避面对自己。", "why": "你和 Alice 一样，容易把生活当成一张关系网：谁喜欢谁、谁在躲谁、谁其实没有说真话。你既需要亲密，也需要一点旁观者的位置。", "love": "先聊天、先建立默契，再慢慢陷进去。你很吃被理解和精神上的来回拉扯；一旦不确定，会忍不住分析对方。", "friendship": "信息中心 + 情绪雷达。你会替朋友记住细节，也会在朋友失恋时第一时间出现。", "strength": "洞察力强、幽默、善于连接人", "blind": "过度分析、容易把别人的关系问题扛到自己身上"}, "Bette Porter": {"actor": "Jennifer Beals", "keywords": ["野心", "审美", "执行力", "控制感"], "analysis": "你对自己和世界都有很高的标准。你不是单纯想赢，而是希望事情按照你认为正确、漂亮、有秩序的方式发生。你很有保护欲，也很容易把责任全部背在自己身上。真正脆弱的时候，你反而可能变得更强势。", "why": "你像 Bette 的地方，是你对“我应该成为怎样的人”有清晰想象，而且会主动把生活推向那个方向。你不太喜欢失控，也不轻易把主动权交出去。", "love": "投入很深，忠诚度高，但需要尊重与空间。你会努力经营关系，也容易因为害怕失去而试图控制局面。", "friendship": "可靠、护短、有资源时会直接出手解决问题。", "strength": "领导力、审美判断、责任感", "blind": "控制欲、难承认自己需要帮助"}, "Tina Kennard": {"actor": "Laurel Holloman", "keywords": ["温和", "成长", "边界", "共情"], "analysis": "你通常愿意先理解别人，再表达自己。你不是没有主见，而是你的力量经常以一种比较安静的方式出现。你会经历“为了关系而让步”到“我也值得被认真对待”的转变。真正成熟之后，你会比很多人更坚定。", "why": "你和 Tina 一样，不一定一开始就知道自己要什么，但你会在经历关系之后越来越清楚自己的边界。", "love": "重视稳定、照顾与长期承诺；你需要安全感，但也越来越不能接受在关系里失去自己。", "friendship": "温柔的长期型朋友，愿意倾听，也会在关键时刻给出实际支持。", "strength": "共情、耐心、韧性", "blind": "容易过度体谅别人、晚一点才说“不”"}, "Shane McCutcheon": {"actor": "Kate Moennig", "keywords": ["自由", "直觉", "魅力", "逃避承诺"], "analysis": "你非常重视自由，不喜欢被别人规定应该怎样生活。你对人的吸引力和情绪变化很敏感，行动通常比解释快。你可以很深情，只是越在乎，越可能本能地想逃。你的核心不是“不需要爱”，而是害怕爱会让你失去自己。", "why": "你像 Shane 的地方，是你更相信自己的感觉，而不是社会给你的标准答案。你需要空间，也需要一个不会把你关进笼子的人。", "love": "化学反应很重要，喜欢强烈的吸引与自由并存；压力一大容易后退。", "friendship": "不一定天天联系，但真正的朋友出事时你会出现。", "strength": "勇敢、直觉、适应力", "blind": "逃避承诺、害怕脆弱"}, "Jenny Schecter": {"actor": "Mia Kirshner", "keywords": ["敏感", "创造力", "自我探索", "戏剧性"], "analysis": "你对自己的内心世界非常敏感，而且很在意“我到底是谁”。你容易被情感、艺术和关系中的微妙变化吸引。你的优势是想象力与自我表达，盲点则是情绪有时会放大现实，让你很难简单地放下某件事。", "why": "你和 Jenny 一样，对身份、欲望和自我表达有很强的探索冲动。你不满足于别人告诉你的答案。", "love": "容易被强烈的情绪与精神连接吸引，关系会深深影响你的自我认知。", "friendship": "需要被真正理解；你记得朋友说过的话，也很在意朋友是否真的看见你。", "strength": "创造力、感受力、表达欲", "blind": "过度沉浸情绪、容易把关系戏剧化"}, "Dana Fairbanks": {"actor": "Erin Daniels", "keywords": ["真诚", "可爱", "谨慎", "成长"], "analysis": "你可能比自己想象中更勇敢。你重视别人怎么看你，但当你真正找到安全感之后，会逐渐活得越来越坦率。你很真诚，也很容易因为害怕伤害别人而犹豫。你的成长来自一次次发现：做自己并不会让真正爱你的人消失。", "why": "你像 Dana 的地方，是你可能一开始有点小心，但真正喜欢一个人、相信一群人之后，会表现出非常真实而温暖的一面。", "love": "慢热，需要确认安全感；一旦确定，会非常认真。", "friendship": "体贴、可靠、愿意一起做普通而快乐的事情。", "strength": "真诚、温暖、忠诚", "blind": "害怕评价、容易低估自己的需求"}, "Helena Peabody": {"actor": "Rachel Shelley", "keywords": ["独立", "魅力", "慷慨", "自我重建"], "analysis": "你习惯拥有选择权，也有能力把自己从复杂处境里重新建立起来。你看起来很有底气，但真正吸引人的地方是你愿意改变——不是为了讨好谁，而是为了成为更好的自己。你需要被尊重，而不是被管理。", "why": "你像 Helena 的地方，是你不愿意永远停留在别人定义你的版本里。你有自己的标准，也愿意为成长付出代价。", "love": "喜欢成熟、坦率、能与你平等相处的人；讨厌被控制。", "friendship": "慷慨、有行动力，喜欢用实际帮助表达在乎。", "strength": "资源整合、独立、恢复力", "blind": "骄傲、难承认自己需要别人"}, "Kit Porter": {"actor": "Pam Grier", "keywords": ["包容", "现实", "幽默", "照顾"], "analysis": "你是很典型的“把人接住”的类型。你不一定认同别人所有的选择，但你知道人需要一个可以回来的地方。你经历过很多，所以看事情比较现实，也更能接受人的复杂。你的力量不是控制，而是容纳。", "why": "你像 Kit 的地方，是你看得懂人性里的混乱，却仍然愿意给别人留一点余地。", "love": "重视陪伴与真实，不太喜欢虚假的完美。", "friendship": "大家都愿意来找你聊天；你会吐槽，但关键时刻很靠谱。", "strength": "包容、幽默、生活智慧", "blind": "有时太习惯照顾别人，忘记自己"}, "Carmen de la Pica Morales": {"actor": "Sarah Shahi", "keywords": ["自信", "感官", "才华", "忠诚"], "analysis": "你有很强的存在感。你知道自己喜欢什么，也不怕表达欲望。你既有艺术感，也很重视关系中的真实回应。你最难接受的不是争吵，而是一个人明明在乎却不说真话。", "why": "你像 Carmen 的地方，是你对化学反应很敏感，同时又需要对方真正尊重你的独立性。", "love": "强烈、直接、浪漫；喜欢感觉，也需要承诺与坦诚。", "friendship": "热情、会带朋友进入自己的生活圈。", "strength": "魅力、表达、忠诚", "blind": "容易被强烈吸引牵着走"}, "Tasha Williams": {"actor": "Rose Rollins", "keywords": ["原则", "稳定", "忠诚", "责任"], "analysis": "你做决定时会考虑后果，而且很在意自己是否对得起自己的价值观。你不喜欢模糊的承诺，也不喜欢关系里反复试探。你给人的安全感来自一致性：说到做到。", "why": "你像 Tasha 的地方，是你宁愿面对困难的真相，也不愿靠漂亮的谎言维持和平。", "love": "认真、稳定、重视承诺；一旦信任破裂，很难装作没发生。", "friendship": "可靠、讲义气，朋友知道你会站在他们身边。", "strength": "原则感、忠诚、稳定", "blind": "容易过于严肃、对自己和别人要求高"}, "Jodi Lerner": {"actor": "Marlee Matlin", "keywords": ["独立", "自信", "艺术", "边界"], "analysis": "你非常珍视自主性。你不喜欢被人替你定义，也不太愿意为了维持关系而改变核心原则。你对亲密关系的要求很高：可以靠近，但不能吞没彼此。", "why": "你像 Jodi 的地方，是你希望别人爱的是完整的你，而不是一个经过修改、方便相处的版本。", "love": "需要精神与生活空间；越被控制，越想后退。", "friendship": "尊重边界，不黏人，但重视深度。", "strength": "独立、原创、边界清晰", "blind": "有时显得疏离、难妥协"}, "Max Sweeney": {"actor": "Daniel Sea", "keywords": ["重建", "坚韧", "现实", "身份探索"], "analysis": "你很清楚改变不是一句口号，而是一段会让人重新认识自己的过程。你愿意面对不舒服的现实，也希望别人把你当成完整的人看待。你有很强的生存能力，但有时会把“坚强”当成唯一的选择。", "why": "你像 Max 的地方，是你不怕重新定义自己，也不愿意让过去决定你的终点。", "love": "需要被尊重身份与边界；真正的亲密来自坦诚和共同成长。", "friendship": "讲义气、现实，不太喜欢虚假的安慰。", "strength": "坚韧、适应、重新开始", "blind": "过度依赖硬撑、表达脆弱较难"},
 "Marina Ferrer": {"actor": "Karina Lombard", "keywords": ["优雅", "艺术感", "神秘", "掌控欲"], "analysis": "你有一种让人想要靠近却又难以捉摸的气质。你对美、艺术和生活品质有很高的要求，也懂得如何营造氛围。表面上看起来温和从容，实际上内心很有主见，不会轻易被别人左右。你相信深度和质量胜过数量，在关系里既愿意投入，也会保留自己的底线。", "why": "你像 Marina 的地方，是你有自己的世界和节奏，不会因为谁而轻易改变。你吸引别人的地方，恰恰是你那份不需要向任何人证明的笃定。", "love": "喜欢精神和气质上的势均力敌；会深情，也会在关系失衡时果断抽离。", "friendship": "不多话但可靠，会用实际行动而不是嘴上说支持。", "strength": "审美、定力、成熟魅力", "blind": "控制欲、有时过于疏离、难完全敞开"},
 "Catherine Rothberg": {"actor": "Sandrine Holt", "keywords": ["掌控", "游戏感", "资源", "试探"], "analysis": "你很懂得如何得到自己想要的东西，也享受赢的感觉。你不缺资源和手段，真正让你在意的是过程中有没有意思。你会用试探和游戏的方式进入关系，但内心深处也在寻找那个能让你认真的人。你的盲点是有时候分不清征服和喜欢的区别。", "why": "你像 Catherine 的地方，是你不信天上掉馅饼的好事，更相信自己主动争取来的东西。你对轻易得到的东西保持警惕。", "love": "喜欢有挑战性的关系，享受追逐和掌控的快感；真正动心的时候反而会不自在。", "friendship": "利益和情义分得清楚，能帮你的时候不会吝啬。", "strength": "资源整合、识人、行动力", "blind": "控制欲强、容易把关系当游戏、难放下防备"}};
const QUESTIONS=[["周五晚上终于空下来，没有任何安排，你最可能怎么过？",[["约朋友出来，边聊天边观察今晚又发生了什么",["Alice Pieszecki","Dana Fairbanks","Carmen de la Pica Morales"]],["去一个我真正感兴趣的地方，好好享受自己的时间",["Marina Ferrer","Bette Porter","Helena Peabody"]],["临时起意，跟着当下的感觉走，去哪儿都无所谓",["Shane McCutcheon","Catherine Rothberg","Carmen de la Pica Morales"]],["待在家里，陪重要的人，或者安静做自己的事",["Tina Kennard","Kit Porter","Tasha Williams"]]]],["朋友突然发来消息：“我出事了。”你第一反应是什么？",[["先把来龙去脉问清楚，顺便理一理她和其他人的关系",["Alice Pieszecki","Jenny Schecter","Helena Peabody"]],["先别问太多，直接过去陪她，到了再说",["Shane McCutcheon","Catherine Rothberg","Kit Porter"]],["先确认她现在最需要的是安慰、建议还是实际帮忙",["Tina Kennard","Dana Fairbanks","Max Sweeney"]],["先听重点，然后一起想一个能真正解决问题的办法",["Marina Ferrer","Bette Porter","Jodi Lerner"]]]],["对你来说，一段恋爱最重要的是什么？",[["聊得来、精神上有来有回，能一直让我觉得有意思",["Alice Pieszecki","Jenny Schecter","Dana Fairbanks"]],["愿意认真承诺，把生活一起经营起来",["Tina Kennard","Tasha Williams","Bette Porter"]],["强烈的吸引、化学反应，以及彼此都保有自由",["Shane McCutcheon","Catherine Rothberg","Carmen de la Pica Morales"]],["彼此尊重，不试图把对方改造成自己想要的样子",["Marina Ferrer","Jodi Lerner","Max Sweeney"]]]],["有人明显误解了你，你通常会怎么处理？",[["我会解释清楚，因为我希望重要的人真正理解我",["Tina Kennard","Dana Fairbanks","Alice Pieszecki"]],["如果这件事并不重要，我不会浪费太多精力",["Shane McCutcheon","Catherine Rothberg","Jodi Lerner"]],["我会反复想这件事，甚至怀疑是不是自己哪里做错了",["Jenny Schecter","Max Sweeney","Dana Fairbanks"]],["我会直接指出对方误解我的地方，不太喜欢绕弯子",["Marina Ferrer","Bette Porter","Tasha Williams"]]]],["在一段关系里，哪一种行为最容易让你彻底失去耐心？",[["有话却不直说，让我一直猜到底发生了什么",["Alice Pieszecki","Dana Fairbanks","Jenny Schecter"]],["控制我的选择，替我决定我应该怎么生活",["Marina Ferrer","Shane McCutcheon","Jodi Lerner"]],["明明看见我的感受，却表现得像根本不重要",["Tina Kennard","Carmen de la Pica Morales","Max Sweeney"]],["答应过的事情反复做不到，让我无法信任",["Tasha Williams","Catherine Rothberg","Bette Porter"]]]],["刚进入一个完全陌生的社交圈，你通常会怎么做？",[["先观察大家的关系和气氛，看看谁和谁比较熟",["Alice Pieszecki","Helena Peabody","Jenny Schecter"]],["找一个看起来有趣的人，直接聊起来",["Shane McCutcheon","Catherine Rothberg","Carmen de la Pica Morales"]],["先保持礼貌，慢慢熟悉，不急着融进去",["Tina Kennard","Dana Fairbanks","Tasha Williams"]],["看看这里有没有值得认真认识、真正能聊得来的人",["Marina Ferrer","Bette Porter","Jodi Lerner"]]]],["遇到一个会改变生活的决定时，你最相信什么？",[["先凭第一感觉判断这件事对不对",["Shane McCutcheon","Catherine Rothberg","Carmen de la Pica Morales"]],["把事实、风险和最后可能得到的结果列出来",["Marina Ferrer","Bette Porter","Tasha Williams"]],["想想这件事对我来说意味着什么，以及我真正想要什么",["Tina Kennard","Jenny Schecter","Max Sweeney"]],["听听真正了解我的人怎么看，再决定",["Dana Fairbanks","Kit Porter","Alice Pieszecki"]]]],["如果让身边的人用一个词形容你，你最希望是哪一种？",[["聪明、有趣，而且特别会读人",["Alice Pieszecki","Kit Porter","Jenny Schecter"]],["强大、可靠，遇到事情真的有能力扛起来",["Marina Ferrer","Bette Porter","Tasha Williams"]],["自由、迷人，而且从来不按别人规定的方式生活",["Shane McCutcheon","Catherine Rothberg","Carmen de la Pica Morales"]],["温柔、真诚，让人觉得可以放心信任",["Tina Kennard","Dana Fairbanks","Max Sweeney"]]]],["和亲近的人发生争执时，你通常会怎么做？",[["先把事情说清楚，不喜欢留下没说完的话",["Bette Porter","Marina Ferrer","Tasha Williams"]],["暂时离开现场，等自己冷静下来再谈",["Shane McCutcheon","Jodi Lerner","Catherine Rothberg"]],["先试着理解对方为什么会这么做",["Tina Kennard","Dana Fairbanks","Kit Porter"]],["情绪一上来就很难装作没事，我需要把感受说出来",["Jenny Schecter","Carmen de la Pica Morales","Helena Peabody"]]]],["明知道一个人可能不适合自己，却还是有点心动，你会怎么处理？",[["先分析这段关系可能带来的后果，但还是会忍不住关注对方",["Alice Pieszecki","Dana Fairbanks","Jenny Schecter"]],["尽量控制自己，不让这份喜欢打乱自己的生活",["Bette Porter","Marina Ferrer","Tasha Williams"]],["顺其自然，既然心动了，就看看它会把我带到哪里",["Shane McCutcheon","Carmen de la Pica Morales","Catherine Rothberg"]],["停下来认真想想：我真正想要的到底是什么",["Tina Kennard","Jodi Lerner","Kit Porter"]]]],["如果让你设计自己的家，你最在意它给你的感觉是什么？",[["热闹一点，朋友随时可以来，家里总有人说话",["Alice Pieszecki","Kit Porter","Carmen de la Pica Morales"]],["漂亮、整洁、有秩序，让我能专心生活",["Bette Porter","Marina Ferrer","Jodi Lerner"]],["简单、轻松，不被太多东西束缚，随时都能出发",["Shane McCutcheon","Max Sweeney","Catherine Rothberg"]],["有固定的生活节奏，也有一个让我安心的人",["Tina Kennard","Dana Fairbanks","Tasha Williams"]]]],["什么样的人最容易让你产生好感？",[["聪明、有趣，能跟我聊很久的人",["Alice Pieszecki","Dana Fairbanks","Jenny Schecter"]],["有野心、有气场，而且做事靠谱的人",["Bette Porter","Marina Ferrer","Helena Peabody"]],["神秘、自由，彼此之间有很强化学反应的人",["Shane McCutcheon","Carmen de la Pica Morales","Catherine Rothberg"]],["温柔、稳定，让我觉得和她在一起可以安心的人",["Tina Kennard","Kit Porter","Max Sweeney"]]]],["连续几天压力都很大时，你通常会怎么自我调节？",[["找朋友把事情从头到尾说一遍，甚至说很多遍",["Alice Pieszecki","Dana Fairbanks","Kit Porter"]],["把自己塞进工作和任务里，让一切重新变得可控",["Bette Porter","Marina Ferrer","Tasha Williams"]],["先消失一会儿，自己处理，不太想解释",["Shane McCutcheon","Jodi Lerner","Catherine Rothberg"]],["写下来、想很多，或者让自己彻底沉浸在情绪里",["Jenny Schecter","Tina Kennard","Carmen de la Pica Morales"]]]],["一段重要的关系结束以后，你更可能怎样看待那段经历？",[["我会反复想：当时的我为什么会做出那个选择",["Alice Pieszecki","Jenny Schecter","Max Sweeney"]],["过去已经发生了，我更愿意把它当成经验继续往前",["Bette Porter","Marina Ferrer","Tasha Williams"]],["有些事情我不会主动说，但它们确实塑造了现在的我",["Shane McCutcheon","Helena Peabody","Catherine Rothberg"]],["我希望现在的自己能更温柔地理解过去那个自己",["Tina Kennard","Dana Fairbanks","Carmen de la Pica Morales"]]]],["朋友做了一个你明显不赞同的决定，你会怎么做？",[["先听她把理由说完，再告诉她我看到的问题",["Alice Pieszecki","Tina Kennard","Kit Porter"]],["我会直接说我不同意，而且不会假装赞成",["Bette Porter","Marina Ferrer","Tasha Williams"]],["只要她愿意承担自己的选择，我不会替她做决定",["Shane McCutcheon","Helena Peabody","Catherine Rothberg"]],["我很容易被她的处境影响，甚至会跟着一起难过",["Dana Fairbanks","Jenny Schecter","Carmen de la Pica Morales"]]]],["如果只能从一段亲密关系里得到一种东西，你最想要什么？",[["被真正理解——不用解释太多，对方就知道我在想什么",["Alice Pieszecki","Jenny Schecter","Max Sweeney"]],["被尊重——我的选择、能力和边界都被认真对待",["Bette Porter","Marina Ferrer","Jodi Lerner"]],["被选择、被热烈地爱——我想知道对方真的很想要我",["Carmen de la Pica Morales","Dana Fairbanks","Catherine Rothberg"]],["被安心地陪伴——平凡的日子里也有人一直在",["Tina Kennard","Tasha Williams","Kit Porter"]]]],["别人认真指出你的缺点时，你第一反应通常是什么？",[["先判断他说的有没有道理，而不是先在意语气",["Bette Porter","Alice Pieszecki","Marina Ferrer"]],["表面上先接受，之后回去自己慢慢消化",["Tina Kennard","Dana Fairbanks","Max Sweeney"]],["如果对方的语气让我觉得被攻击，我会立刻防御",["Catherine Rothberg","Shane McCutcheon","Carmen de la Pica Morales"]],["很可能想很久，甚至开始怀疑自己是不是哪里不好",["Jenny Schecter","Kit Porter","Tasha Williams"]]]],["如果只能选一个词概括你想要的人生，你会选什么？",[["自由——我希望始终有重新选择生活的权利",["Catherine Rothberg","Shane McCutcheon","Jodi Lerner"]],["成就——我希望自己真的完成了想完成的事情",["Bette Porter","Helena Peabody","Marina Ferrer"]],["真实——我不想活成别人期待的样子",["Alice Pieszecki","Max Sweeney","Jenny Schecter"]],["归属——我希望身边有真正属于我的人和地方",["Tina Kennard","Dana Fairbanks","Kit Porter"]]]],["你最看重朋友身上的哪一点？",[["她能看懂我没有说出口的那些东西",["Alice Pieszecki","Jenny Schecter","Shane McCutcheon"]],["关键时刻愿意站在我这边",["Catherine Rothberg","Tasha Williams","Kit Porter"]],["尊重我的边界，也不会因为亲近就越界",["Jodi Lerner","Max Sweeney","Marina Ferrer"]],["让我可以完全做自己，不需要一直表现得很好",["Dana Fairbanks","Tina Kennard","Carmen de la Pica Morales"]]]],["如果突然得到一笔足以改变生活的钱，你第一反应是什么？",[["先拿去做一个有趣的项目，或者换一种生活体验",["Alice Pieszecki","Carmen de la Pica Morales","Jenny Schecter"]],["改善生活条件，同时把长期的安全感安排好",["Bette Porter","Tasha Williams","Marina Ferrer"]],["旅行、搬家，或者干脆开始一段完全不同的生活",["Catherine Rothberg","Shane McCutcheon","Max Sweeney"]],["先把家人和重要的人照顾好，再考虑自己",["Tina Kennard","Dana Fairbanks","Kit Porter"]]]],["你怎么看待“承诺”这件事？",[["我愿意承诺，但希望这份承诺是我自己认真选择的",["Alice Pieszecki","Jodi Lerner","Max Sweeney"]],["承诺就是承诺，说了就应该做到",["Tasha Williams","Bette Porter","Marina Ferrer"]],["承诺不能变成束缚，关系也应该允许人改变",["Catherine Rothberg","Shane McCutcheon","Carmen de la Pica Morales"]],["我很重视承诺，但有时候会担心自己做不到",["Dana Fairbanks","Jenny Schecter","Kit Porter"]]]],["什么瞬间最容易让你突然心软？",[["对方终于不装了，愿意把真正的想法告诉我",["Alice Pieszecki","Jenny Schecter","Max Sweeney"]],["一个平时很强撑的人终于承认自己需要帮助",["Catherine Rothberg","Bette Porter","Kit Porter"]],["一个人突然毫无防备地笑出来",["Shane McCutcheon","Carmen de la Pica Morales","Dana Fairbanks"]],["对方记住了一个只有很在乎我的人才会注意到的小细节",["Tina Kennard","Helena Peabody","Marina Ferrer"]]]],["在你看来，一个人成熟的标志是什么？",[["知道什么时候应该说出来，也知道什么时候不必证明自己",["Alice Pieszecki","Kit Porter","Jodi Lerner"]],["有能力承担自己做出的选择和后果",["Bette Porter","Tasha Williams","Marina Ferrer"]],["敢于重新定义自己，而不是永远被过去决定",["Catherine Rothberg","Shane McCutcheon","Max Sweeney"]],["学会爱别人，同时也知道怎样保护自己",["Tina Kennard","Dana Fairbanks","Carmen de la Pica Morales"]]]],["如果你的人生是一部剧，你希望最后留下什么感觉？",[["精彩、混乱、永远有新的故事发生",["Alice Pieszecki","Jenny Schecter","Carmen de la Pica Morales"]],["最后我成为了真正想成为的人",["Bette Porter","Jodi Lerner","Marina Ferrer"]],["无论经历什么，我都没有背叛自己的自由",["Catherine Rothberg","Shane McCutcheon","Helena Peabody"]],["回头看的时候，我身边还有真正爱我的人",["Tina Kennard","Dana Fairbanks","Kit Porter"]]]]];

 document.getElementById("app").innerHTML='<div class="header"><div class="kicker">THE L WORD · SEASONS 1—6</div><h1>WHO ARE YOU?</h1><div class="subtitle">一个以《The L Word》1–6 季角色为原型的性格测试。没有标准答案，选择那个“最像你”的选项。</div></div><div class="start"><div class="startcard"><div class="kicker">A PERSONALITY CHART</div><h2>你是谁？</h2><p>24 道题 · 4 个选项 · 14 位角色。测试结束后，你会得到完整人物画像、关系结果，以及一个可以直接分享给朋友的结果链接。</p><button class="btn primary" onclick="startQuiz()">START THE QUIZ →</button><div class="note">完全离线运行：14 张人物照片已经直接嵌入这个 HTML 文件，不需要访问外部网站。</div><div class="note" style="opacity:.5;font-size:11px;margin-top:8px;">@shin · 3011664685@qq.com</div></div></div>';
}
function startQuiz(){index=0;answers=Array(QUESTIONS.length).fill(null);renderQuestion();}
function renderQuestion(){
 const q=QUESTIONS[index],pct=Math.round((index/QUESTIONS.length)*100),sel=answers[index];
 let choices=q[1].map((o,n)=>'<button class="choice '+(sel===n?'selected':'')+'" onclick="choose('+n+')"><b>'+String.fromCharCode(65+n)+'</b>'+esc(o[0])+'</button>').join("");
 document.getElementById("app").innerHTML='<div class="header"><div class="kicker">QUESTION '+(index+1)+' / '+QUESTIONS.length+'</div><h1 style="font-size:46px">THE L WORD</h1><div class="progress"><i style="width:'+pct+'%"></i></div></div><div class="content"><h2 style="font-family:Georgia,serif;font-size:38px;line-height:1.25;margin:0">'+esc(q[0])+'</h2><div class="choicegrid">'+choices+'</div><div class="nav"><button class="btn secondary" '+(index===0?'disabled':'')+' onclick="back()">← 上一题</button><button class="btn primary" '+(sel===null?'disabled':'')+' onclick="next()">'+(index===QUESTIONS.length-1?'SEE MY RESULT →':'下一题 →')+'</button></div></div>';
}
function choose(n){answers[index]=n;renderQuestion();}
function back(){if(index>0){index--;renderQuestion();}}
function next(){if(answers[index]===null)return;if(index<QUESTIONS.length-1){index++;renderQuestion();}else renderResult();}
function scoreAll(){
 const raw={}; Object.keys(PROFILES).forEach(k=>raw[k]=0);
 answers.forEach((a,i)=>{
   if(a===null)return;
   QUESTIONS[i][1][a][1].forEach((name,j)=>raw[name]+=j===0?3:j===1?2:1);
 });
 const maxPossible={};
 Object.keys(PROFILES).forEach(name=>{
   maxPossible[name]=QUESTIONS.reduce((total,q)=>{
     let best=0;
     q[1].forEach(opt=>{
       const pos=opt[1].indexOf(name);
       if(pos===0)best=Math.max(best,3);
       else if(pos===1)best=Math.max(best,2);
       else if(pos===2)best=Math.max(best,1);
     });
     return total+best;
   },0);
 });
 const normalized={};
 Object.keys(PROFILES).forEach(name=>normalized[name]=maxPossible[name]?raw[name]/maxPossible[name]:0);
 return normalized;
}
function result(){
 const s=scoreAll(); return Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];
}
function sec(title,text){return '<div class="section"><h3>'+title+'</h3><p>'+esc(text)+'</p></div>';}

function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
function resultUrl(name){const u=new URL(location.href);u.search='';u.searchParams.set('result',name);return u.toString()}
async function shareResult(name){const url=resultUrl(name),p=PROFILES[name];try{if(navigator.share){await navigator.share({title:'THE L WORD · WHO ARE YOU?',text:'我的《The L Word》角色结果是：'+name+'。',url});showToast('分享面板已打开');return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(url);showToast('结果链接已复制');}catch(e){prompt('复制这个结果链接：',url)}}
async function copyResultLink(name){const url=resultUrl(name);try{await navigator.clipboard.writeText(url);showToast('结果链接已复制');}catch(e){prompt('复制这个结果链接：',url)}}
function openSharedResult(){const name=new URLSearchParams(location.search).get('result');if(name&&PROFILES[name]){index=-1;renderResult(name);return true}return false}

function chartNode(name, x, y, winner){
 const short=name.replace(' de la Pica Morales','').replace(' McCutcheon','').replace(' Pieszecki','').replace(' Kennard','').replace(' Schecter','').replace(' Fairbanks','').replace(' Peabody','').replace(' Porter','').replace(' Williams','').replace(' Lerner','').replace(' Sweeney','');
 return '<button class="chart-node '+(name===winner?'selected':'')+'" style="left:'+x+'%;top:'+y+'%" onclick="showChartCharacter(\''+esc(name).replace(/\\'/g,"\\\\'")+'\')" aria-label="'+esc(name)+'"><span class="node-photo"><img src="'+IMAGES[name]+'" alt="'+esc(name)+'"></span><span class="node-name">'+esc(short)+'</span></button>';
}
function showChartCharacter(name){
 const el=document.querySelector('.chart-center strong'); if(el) el.textContent=name; showToast(name);
}
function relationshipChart(winner){return '';
 const names=Object.keys(PROFILES);
 const pos={
  'Alice Pieszecki':[50,10],'Bette Porter':[75,17],'Tina Kennard':[91,39],'Shane McCutcheon':[86,70],
  'Jenny Schecter':[67,89],'Dana Fairbanks':[33,89],'Helena Peabody':[14,70],'Kit Porter':[9,39],
  'Carmen de la Pica Morales':[25,17],'Tasha Williams':[62,30],'Jodi Lerner':[38,30],'Max Sweeney':[50,92]
 };
 const edges=[]; const seen=new Set();
 names.forEach(a=>{const rs=RELATIONS[a]||[];rs.forEach((b,i)=>{if(!PROFILES[b])return;const key=[a,b].sort().join('|');if(seen.has(key))return;seen.add(key);edges.push({a,b,type:i===0?'love':i===1?'friend':'conflict'});});});
 const line=(e)=>{const [x1,y1]=pos[e.a], [x2,y2]=pos[e.b]; const sel=e.a===winner||e.b===winner; return '<line class="chart-line '+e.type+(sel?' selected':'')+'" x1="'+x1+'%" y1="'+y1+'%" x2="'+x2+'%" y2="'+y2+'%" />';};
 const nodes=names.map(n=>chartNode(n,pos[n][0],pos[n][1],winner)).join('');
 const lines=edges.map(line).join('');
 return '<div class="chart-v2"><div class="chart-head"><div><div class="kicker">THE CHART</div><h3>YOUR RELATIONSHIP MAP</h3></div><div class="chart-sub">像剧里的关系墙一样，把人物放进同一张网里。</div></div><div class="chart-canvas"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+lines+'</svg><div class="chart-center"><div><div class="kicker">YOUR MATCH</div><strong>'+esc(winner)+'</strong><small>点击人物可快速查看</small></div></div>'+nodes+'</div><div class="chart-legend"><span class="legend-item"><i class="legend-dot love"></i>强烈吸引</span><span class="legend-item"><i class="legend-dot"></i>朋友／支持</span><span class="legend-item"><i class="legend-dot conflict"></i>容易冲突</span></div><div class="chart-note">线条来自人物关系标签；越亮的线代表与你的关系越值得注意。人物照片保持原始比例，不裁切。</div></div>';
}
function renderResult(sharedWinner){
 const winner=sharedWinner||result(),p=PROFILES[winner];
 document.getElementById("app").innerHTML='<div class="header"><div class="kicker">THE L WORD · YOUR CHART</div><h1 style="font-size:38px">YOUR L WORD MATCH</h1></div><div class="content"><div class="result"><div class="photo-wrap"><img class="photo" src="'+IMAGES[winner]+'" alt="'+esc(winner)+'"><div class="photo-badge">SEASONS 1—6 · ORIGINAL CHARACTER</div><div class="note">剧中人物照片 · 已直接嵌入网页文件，不依赖外部图片网站。</div></div><div><div class="kicker">CHARACTER</div><h2>'+esc(winner)+'</h2><div class="actor">'+esc(p.actor)+'</div><div class="tags">'+p.keywords.map(x=>'<span class="tag">'+esc(x)+'</span>').join("")+'</div>'+sec("PERSONALITY ANALYSIS",p.analysis)+sec("WHY YOU ARE LIKE HER",p.why)+sec("LOVE PATTERN",p.love)+sec("FRIENDSHIP PATTERN",p.friendship)+'<div class="section"><h3>YOUR STRENGTH / YOUR BLIND SPOT</h3><p><b>优势：</b>'+esc(p.strength)+'<br><b>盲点：</b>'+esc(p.blind)+'</p></div></div></div>'+relationshipChart(winner)+'<div class="sharebox"><h3>SHARE YOUR RESULT</h3><div>把你的结果发给朋友，朋友打开链接即可直接看到这个角色结果。</div><div class="share-actions"><button class="btn primary" onclick="shareResult(\''+esc(winner)+'\')">↗ 分享我的结果</button><button class="btn secondary" onclick="copyResultLink(\''+esc(winner)+'\')">复制结果链接</button></div></div><button class="btn primary restart" onclick="startQuiz()">RETAKE THE QUIZ ↻</button></div>';
}
if(!openSharedResult()) renderStart();
</script><div class="light"></div><div data-trae-edit-ui="true"></div></body></html>
